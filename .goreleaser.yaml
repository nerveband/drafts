# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: "drafts"
    dir: "./cmd/drafts"
    binary: "drafts"
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - "darwin"
    goarch:
      - "amd64"
      - "arm64"

archives:
  - id: drafts
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - drafts
    files:
      - none*

checksum:
  name_template: "checksums.txt"
